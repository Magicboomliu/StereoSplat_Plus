[project]
authors = [{name = "Zihua Liu", email = "zliu@ok.sc.e.titech.ac.jp"}]
dependencies = []
name = "stereosplat"
requires-python = ">= 3.10"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64"]

[tool.pixi.environments]
# 用不同 environment 隔离 feature，运行时用 -e 选择
default = { features = ["common", "cu118"] }
cu118 = { features = ["common", "cu118"] }

[tool.pixi.dependencies]
# mirror: conda create --name omniscene "python==3.10"
python = "3.10.*"
pip = "*"
setuptools = "<82"
wheel = "*"
numpy = "<2"

# build/runtime helpers for mmcv ops
git = "*"
cmake = "*"
pkg-config = "*"
# CUDA 11.x 需要 gcc/g++ < 12（否则编译 CUDA 扩展会报错）
gcc_linux-64 = "11.*"
gxx_linux-64 = "11.*"

# mmcv build deps you installed via pip
ninja = "*"
psutil = "*"

[tool.pixi.pypi-dependencies]
# 注意：将本项目作为 pypi editable 依赖时，pixi 需要先解析 build-system.requires（例如 hatchling）
# 在某些网络/registry 条件下会导致 "hatchling not found" 而安装失败。
# 因此这里不走 solver 安装本项目，改为在 task 里用 pip -e 安装。

[tool.pixi.feature.cu118.pypi-options]
index-url = "https://download.pytorch.org/whl/cu118"
extra-index-urls = ["https://pypi.org/simple/"]
index-strategy = "unsafe-best-match"

[tool.pixi.feature.cu118.pypi-dependencies]
torch = "==2.1.0+cu118"
torchvision = "==0.16.0+cu118"
torchaudio = "==2.1.0"

[tool.pixi.feature.cu118.dependencies]
# 构建 diff-gaussian-rasterization 需要 nvcc + CUDA headers（仅 cu118 环境需要 11.8）
cuda-nvcc = "11.8.*"
cuda-cudart = "11.8.*"
cuda-cudart-dev = "11.8.*"
# 提供 thrust / libcudacxx（解决 cuda/std/* 与 thrust/* 头文件缺失）
cuda-cccl = "11.8.*"

[tool.pixi.feature.common.pypi-dependencies]
# ── 训练 / 评测核心 ──────────────────────────────────────────────────────────
accelerate        = "*"
wandb             = "*"
einops            = "*"
tyro              = "*"
safetensors       = "*"
rich              = "*"
tqdm              = "*"
packaging         = "*"

# ── 视觉 / 3D ────────────────────────────────────────────────────────────────
Pillow            = "*"
imageio           = "*"
imageio-ffmpeg    = "*"
moviepy           = "==1.0.3"
matplotlib        = "*"
scikit-image      = "*"
scikit-learn      = "*"
scipy             = "*"
opencv-python     = "==4.10.0.84"
opencv-python-headless = "==4.10.0.84"
trimesh           = "*"
plyfile           = "*"
pygltflib         = "*"
xatlas            = "*"
roma              = "*"
rembg             = { version = "*", extras = ["gpu"] }
kiui              = ">=0.2.3"

# ── 感知损失 / 模型 ────────────────────────────────────────────────────────────
lpips             = "*"
timm              = "==0.4.12"
taming-transformers = "*"

# ── 语言 / 配置 ────────────────────────────────────────────────────────────────
ftfy              = "==6.2.0"
jaxtyping         = "==0.2.31"
omegaconf         = "==2.3.0"
typeguard         = "==2.13.3"

# ── Diffusers 生态（Difix3D）──────────────────────────────────────────────────
# diffusers / peft / transformers / huggingface_hub 版本需严格对齐
# diffusers==0.25.1 依赖 cached_download，该 API 在 huggingface_hub>=0.20.0 中被移除
diffusers         = "==0.25.1"
huggingface-hub   = ">=0.20.2,<0.24.0"
peft              = "==0.11.1"
transformers      = "==4.28.1"

# 注意：openmim / mmengine 在某些 pixi/pypi 解析器下会报 "not found"
# 改由 task (mmlab-bootstrap) 用 pip 安装，不放在 solver 里

[tool.pixi.tasks]
# 基础：升级 pip/setuptools
# 需要 pkg_resources（setuptools>=82 移除）；同时 openxlab 依赖 setuptools~=60.2.0
bootstrap = "python -m pip install --upgrade pip 'setuptools==60.2.0'"

# 安装本项目（等价于 pip install -e .）
install-self = { cmd = "python -m pip install -e .", depends-on = ["bootstrap"] }

# openmim / mmengine（从 pypi solver 挪到 task）
mmlab-bootstrap = { cmd = "python -m pip install -U openmim mmengine && python -m pip install 'setuptools==60.2.0'", depends-on = ["bootstrap"] }

# 3DGS rasterizer（本地修改版：在 rgb/alpha/depth 基础上增加 conf 渲染）
# 使用本地目录，不再从 GitHub 克隆；若目录不存在则报错提示
rasterizer-clone = "test -d diff-gaussian-rasterization || (echo 'ERROR: diff-gaussian-rasterization directory not found. Please extract the zip first.' && exit 1)"
# 构建脚本在编译阶段 import torch，需 --no-build-isolation。
# 显式指定 TORCH_CUDA_ARCH_LIST=8.9（RTX 4090, Ada Lovelace），
# 避免因驱动/runtime 版本不匹配导致 _get_cuda_arch_flags 返回空列表而崩溃。
rasterizer-install = { cmd = "TORCH_CUDA_ARCH_LIST='8.9' python -m pip install ./diff-gaussian-rasterization --no-build-isolation", depends-on = ["rasterizer-clone"] }

# 编译并安装 mmcv v2.1.0（可通过 env 注入 CUDA 架构等）
# 原本从源码编译 mmcv 会强依赖一整套匹配的 CUDA headers/libraries，容易在不同机器/驱动/conda 包组合下踩坑。
# 这里改为安装 OpenMMLab 提供的 cu118/torch2.1 预编译 wheel（包含 ops），更稳。
mmcv-install = { cmd = "python -m pip install -U \"mmcv==2.1.0\" -f https://download.openmmlab.com/mmcv/dist/cu118/torch2.1/index.html", depends-on = ["mmlab-bootstrap"] }

# mmdet / mmdet3d
# mmdet3d==1.4.0 需要 mmdet>=3.0.0,<3.3.0（你现在装到 3.3.0 会冲突）
mmdet-install = { cmd = "mim install 'mmdet>=3.0.0,<3.3.0'", depends-on = ["mmlab-bootstrap"] }
mmdet3d-install = { cmd = "mim install 'mmdet3d==1.4.0'", depends-on = ["mmlab-bootstrap"] }

# 一键：基础 + rasterizer + mmcv + mmdet3d
# requirements.txt 里的包已移入 [tool.pixi.feature.common.pypi-dependencies]，pixi install 自动处理
setup = { depends-on = ["bootstrap", "install-self", "rasterizer-install", "mmcv-install", "mmdet-install", "mmdet3d-install"] }
